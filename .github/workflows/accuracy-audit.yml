name: Accuracy & Text Integrity Verification

on:
  schedule:
    # Run weekly on Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      book:
        description: 'Book Abbreviation to compare (e.g. GC, DA, SC, PP, 3SP, or ALL)'
        required: true
        default: 'GC'
      chapter:
        description: 'Specific chapter number to compare (leave empty for sample/all)'
        required: false
        default: '4'

jobs:
  audit-and-compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run Full Database Structural Integrity Audit
        run: npx tsx scripts/egwAuditAction.ts

      - name: Run Live Site Word-for-Word Accuracy Comparator
        run: |
          npx tsx scripts/compareWithLiveAction.ts "${{ github.event.inputs.book || 'GC' }}" "${{ github.event.inputs.chapter || '4' }}"

